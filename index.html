<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X Nasa App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #0f172a);
            background-image: radial-gradient(circle at top right, rgba(36, 129, 204, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(255, 87, 87, 0.1), transparent 40%);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease-out;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #2481cc, #1a5f9e);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(36, 129, 204, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 5px 0;
            text-align: center;
            background: linear-gradient(90deg, #ffffff, #a0c4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #8b9bb4);
            margin: 0 0 35px 0;
            text-align: center;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .app-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            background: var(--tg-theme-secondary-bg-color, rgba(255, 255, 255, 0.05));
            color: var(--tg-theme-text-color, #ffffff);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .app-button:active {
            transform: scale(0.96);
            background: var(--tg-theme-secondary-bg-color, rgba(255, 255, 255, 0.1));
        }

        .app-button .btn-text {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-button .arrow {
            opacity: 0.5;
            font-size: 20px;
        }

        .btn-gift { background: linear-gradient(135deg, #2481cc, #1a5f9e); box-shadow: 0 6px 15px rgba(36, 129, 204, 0.3); border: none; }
        .btn-username { background: linear-gradient(135deg, #2ea6ff, #1d8cda); box-shadow: 0 6px 15px rgba(46, 166, 255, 0.3); border: none; }
        .btn-ad { background: linear-gradient(135deg, #ff5e5e, #d93d3d); box-shadow: 0 6px 15px rgba(255, 94, 94, 0.3); border: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        
        /* صندوق التشخيص */
        #debug-box {
            margin-top: 20px;
            font-size: 12px;
            color: #ff5e5e;
            text-align: center;
            background: rgba(255, 0, 0, 0.1);
            padding: 10px;
            border-radius: 10px;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">🚀</div>
        <h1>X Nasa App</h1>
        <p class="subtitle">اختر القسم الذي تريد النشر فيه</p>
        
        <div class="button-container">
            <button class="app-button btn-gift" onclick="sendAction('post_gift')">
                <span class="btn-text">🎁 نشر هدية</span>
                <span class="arrow">‹</span>
            </button>
            
            <button class="app-button btn-username" onclick="sendAction('post_username2')">
                <span class="btn-text">💬 نشر معرف</span>
                <span class="arrow">‹</span>
            </button>
            
            <button class="app-button btn-ad" onclick="sendAction('post_username')">
                <span class="btn-text">📢 نشر إعلان</span>
                <span class="arrow">‹</span>
            </button>
        </div>

        <!-- صندوق لعرض الأخطاء إذا حدثت -->
        <div id="debug-box"></div>
    </div>

    <script>
        // تهيئة التطبيق
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        if (tg.colorScheme === 'light') {
            document.documentElement.style.setProperty('--tg-theme-bg-color', '#f4f6fa');
            document.documentElement.style.setProperty('--tg-theme-text-color', '#1a202c');
            document.documentElement.style.setProperty('--tg-theme-hint-color', '#718096');
            document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', '#ffffff');
        }

        // دالة إرسال الأمر للبوت
        function sendAction(action) {
            try {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
                
                // إرسال البيانات
                if (typeof tg.sendData === 'function') {
                    tg.sendData(JSON.stringify({ action: action }));
                    tg.close();
                } else {
                    showDebug("خطأ: دالة sendData غير متوفرة. يرجى فتح التطبيق من تيليجرام.");
                }
            } catch (error) {
                showDebug("حدث خطأ أثناء الإرسال: " + error.message);
            }
        }

        // دالة لإظهار الأخطاء على الشاشة
        function showDebug(msg) {
            const box = document.getElementById('debug-box');
            box.style.display = 'block';
            box.innerText = msg;
        }
    </script>
</body>
</html>
