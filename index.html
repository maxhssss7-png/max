<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>الحاسبة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#12151c; --key:#222834; --op:#3b5bdb; --fn:#394152; --text:#f2f4f8; --muted:#8b95a8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; user-select:none; touch-action:manipulation; }
  #app { height:100%; display:flex; flex-direction:column; max-width:480px; margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px); }
  #screen { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end;
    direction:ltr; padding:10px 8px 18px; overflow:hidden; }
  #expr { color:var(--muted); font-size:22px; min-height:28px; word-break:break-all; text-align:right; }
  #out { font-size:64px; font-weight:600; line-height:1.1; max-width:100%; overflow-x:auto; white-space:nowrap; }
  #keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; direction:ltr; }
  button { font:inherit; font-size:26px; font-weight:500; border:0; border-radius:20px; height:68px;
    background:var(--key); color:var(--text); cursor:pointer; transition:transform .06s; }
  button:active { transform:scale(.94); }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  #credit { text-align:center; color:var(--muted); font-size:13px; margin-top:12px; direction:ltr; }
  .fn { background:var(--fn); } .op { background:var(--op); } .zero { grid-column:span 2; }
</style>
</head>
<body>
<div id="app">
  <div id="screen"><div id="expr"></div><div id="out">0</div></div>
  <div id="keys">
    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="±">±</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="÷">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="×">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="−">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button>
    <button class="zero" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="op" data-k="=">=</button>
  </div>
  <div id="credit">X Nasa - @sstss</div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#12151c'); tg.setBackgroundColor('#12151c'); } catch(e){} }
const tap = () => { try { tg.HapticFeedback.selectionChanged(); } catch(e){} };

const out = document.getElementById('out'), exprEl = document.getElementById('expr');
let cur = '0', prev = null, op = null, fresh = false;

const calc = (a, b, o) => {
  a = parseFloat(a); b = parseFloat(b);
  let r = o === '+' ? a + b : o === '−' ? a - b : o === '×' ? a * b : (b === 0 ? NaN : a / b);
  return isFinite(r) ? String(+r.toPrecision(12)) : 'خطأ';
};
function show() {
  out.textContent = cur;
  out.style.fontSize = cur.length > 12 ? '36px' : cur.length > 8 ? '48px' : '64px';
  exprEl.textContent = prev !== null && op ? prev + ' ' + op : '';
}
function press(k) {
  tap();
  if (cur === 'خطأ' && k !== 'C') return;
  if (/\d/.test(k)) {
    cur = (cur === '0' || fresh) ? k : cur + k; fresh = false;
  } else if (k === '.') {
    if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.';
  } else if (k === 'C') {
    cur = '0'; prev = null; op = null; fresh = false;
  } else if (k === '±') {
    if (cur !== '0') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur;
  } else if (k === '%') {
    cur = String(+(parseFloat(cur) / 100).toPrecision(12));
  } else if (k === '=') {
    if (op !== null && prev !== null) { cur = calc(prev, cur, op); prev = null; op = null; fresh = true; }
  } else { // + − × ÷
    if (op !== null && prev !== null && !fresh) cur = calc(prev, cur, op);
    prev = cur; op = k; fresh = true;
  }
  show();
}
document.getElementById('keys').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) press(b.dataset.k);
});
addEventListener('keydown', e => {
  const m = { '*':'×', '/':'÷', '-':'−', 'Enter':'=', 'Escape':'C', ',':'.' };
  const k = m[e.key] || e.key;
  if (/^[0-9.+=%]$/.test(k) || '×÷−C'.includes(k)) press(k);
});
show();
</script>
</body>
</html>
