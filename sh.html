:root{
  --bg:#0f1216; --panel:#1a1e25; --panel-2:#232831; --panel-3:#2c323d; --line:#2f3641;
  --fg:#eef1f5; --muted:#97a1ae; --faint:#6b7684;
  --accent:#33c3ff; --accent-strong:#1593d6; --accent-ink:#03202e;
  --brand:#ffb627; --brand-ink:#1d1400;
  --danger:#ff5a4e; --ok:#35c98a; --warn:#ff9f3d;
  --nav:#1474d4;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  --radius:18px;
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
body.day{
  --bg:#eef2f6; --panel:#ffffff; --panel-2:#f2f5f9; --panel-3:#e6ebf1; --line:#e1e6ec;
  --fg:#15202b; --muted:#5b6876; --faint:#8b97a5;
  --accent:#0aa5e8; --accent-strong:#0786c0; --accent-ink:#ffffff;
  --shadow:0 8px 22px rgba(21,32,43,.16);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.ic.lg{width:26px;height:26px}
#map{position:fixed;inset:0;z-index:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:var(--font)}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{font-size:9px;background:transparent!important;color:var(--faint)!important}
.leaflet-control-attribution a{color:var(--faint)!important}
.raster-night .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.8)}

/* شاشة البداية */
.splash{position:fixed;inset:0;z-index:999;background:#0f1216;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.splash h1{margin:6px 0 0;font-size:30px;font-weight:700;color:#eef1f5;letter-spacing:.3px}
.splash p{margin:0;color:#97a1ae;font-size:13px}
.splash .sig{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);color:#6b7684;font-size:12px}

/* الشريط العلوي */
.top{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.top > *{pointer-events:auto}
.searchbox{flex:1;min-width:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.searchbox .ic{color:var(--muted)}
.searchbox input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--fg);font:inherit;font-size:16px;outline:none}
.searchbox input::placeholder{color:var(--faint)}
.searchbox input::-webkit-search-cancel-button{display:none}
.clearq{border:0;background:none;padding:6px;margin:-6px;color:var(--muted);display:grid;place-items:center}
.sqbtn{width:52px;height:52px;flex:none;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--fg)}

/* نتائج البحث */
.results{position:fixed;z-index:610;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 70px);max-height:min(60vh,520px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 0}
.rlabel{padding:10px 16px 6px;color:var(--faint);font-size:12px;font-weight:600;letter-spacing:.3px}
.ritem{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:none;border:0;padding:11px 16px}
.ritem:active{background:var(--panel-2)}
.ritem .rico{width:38px;height:38px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;color:var(--accent);flex:none}
.ritem .rtxt{flex:1;min-width:0}
.ritem .rtxt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .rtxt small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .rdist{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ritem .rdel{border:0;background:none;color:var(--faint);padding:6px;display:grid;place-items:center}
.rempty{padding:18px 16px;color:var(--muted);text-align:center}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 8px 10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:8px 2px;border-radius:14px;font-size:12px;color:var(--fg)}
.cat:active{background:var(--panel-2)}
.cat span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff}

/* لوحة التوجيه */
.banner{position:fixed;z-index:620;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--nav);color:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;align-items:center}
.banner .barrow{width:56px;height:56px;display:grid;place-items:center;flex:none}
.banner .barrow .ic{width:46px;height:46px;stroke-width:2.6;transition:transform .2s}
.banner .bbody{flex:1;min-width:0}
.banner .bdist{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.banner .btext{font-size:16.5px;font-weight:600}
.banner .bnext{font-size:12.5px;opacity:.8;margin-top:3px}
body.navigating .top,body.navigating .results{display:none}

/* السرعة */
.speed{position:fixed;z-index:500;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 74px);
  width:62px;height:62px;border-radius:50%;background:var(--panel);border:3px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;text-align:center;line-height:1}
.speed b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.speed span{font-size:9.5px;color:var(--muted)}
.speed.over{border-color:var(--danger);background:var(--danger);color:#fff}
.speed.over span{color:#fff}
body.navigating .speed{top:calc(env(safe-area-inset-top,0px) + 118px)}

/* الأزرار العائمة */
.fabs{position:fixed;z-index:500;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;
  bottom:calc(var(--sheet-h,200px) + 14px);transition:bottom .25s ease}
.fab{width:48px;height:48px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--fg)}
.fab.on{color:var(--accent)}
.report-fab{position:fixed;z-index:500;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--sheet-h,200px) + 14px);transition:bottom .25s ease;
  width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.report-fab .ic{width:28px;height:28px;stroke-width:2.4}

/* اللوحة السفلية */
.sheet{position:fixed;z-index:550;left:0;right:0;bottom:0;background:var(--panel);border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.28);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 12px;font-size:19px;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:4px 0;font-size:12.5px;color:var(--fg)}
.qbtn span{width:54px;height:54px;border-radius:17px;background:var(--panel-2);display:grid;place-items:center;color:var(--accent)}
.qbtn:active span{background:var(--panel-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sig{margin:14px 0 0;text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:.2px}

.route-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.route-head .eta{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.route-head .sub{color:var(--muted);font-variant-numeric:tabular-nums}
.dest{display:flex;align-items:center;gap:8px;margin:8px 0 2px;color:var(--fg);font-weight:600;min-width:0}
.dest .ic{color:var(--danger)}
.dest span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.first{color:var(--muted);font-size:13px;margin:2px 0 0}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 12px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;font-size:12px;color:var(--muted)}
.act span{width:44px;height:44px;border-radius:14px;background:var(--panel-2);display:grid;place-items:center;color:var(--fg)}
.btnrow{display:flex;gap:10px}
.btn{flex:1;height:50px;border-radius:15px;border:0;background:var(--panel-2);color:var(--fg);font-weight:600;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.grow2{flex:2}
.field{margin-bottom:12px}
.input,.select{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;font-size:16px;padding:0 14px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.crosshair{position:fixed;left:50%;top:50%;z-index:450;transform:translate(-50%,-100%);color:var(--danger);pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.crosshair .ic{width:44px;height:44px;fill:var(--danger);stroke:#fff;stroke-width:1.5}

/* نافذة البلاغ */
.modal{position:fixed;inset:0;z-index:700;background:rgba(5,8,12,.55);display:flex;align-items:flex-end;animation:fade .2s ease}
.modal .card{width:100%;background:var(--panel);border-radius:24px 24px 0 0;animation:up .25s ease;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.modal h3{margin:0 0 4px;font-size:18px}
.modal p{margin:0 0 16px;color:var(--muted);font-size:13px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.rtile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:16px;border:0;background:var(--panel-2);font-weight:600;font-size:13.5px;color:var(--fg)}
.rtile span{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}

/* صفحة الإعدادات */
.page{position:fixed;inset:0;z-index:800;background:var(--bg);display:flex;flex-direction:column;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(-24px);opacity:0}}
.page header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.page header h2{margin:0;font-size:18px;flex:1}
.back{width:44px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--fg)}
.page .body{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.gtitle{margin:18px 4px 8px;color:var(--faint);font-size:12.5px;font-weight:600;letter-spacing:.3px}
.gtitle:first-child{margin-top:2px}
.group{background:var(--panel);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:right}
.item:last-child{border-bottom:0}
.item .iico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.item .itxt{flex:1;min-width:0}
.item .itxt b{display:block;font-weight:600}
.item .itxt small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ival{color:var(--muted);font-size:13px}
.item.stack{flex-direction:column;align-items:stretch}
.item.stack .head{display:flex;align-items:center;gap:12px}
.seg{display:flex;background:var(--panel-2);border-radius:12px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;height:38px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--panel-3);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(-20px)}
.mini-del{border:0;background:var(--panel-2);color:var(--danger);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:600}
.about{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:22px 16px}
.about img{width:64px;height:64px;border-radius:17px;margin-bottom:6px}
.about b{font-size:17px}
.about small{color:var(--muted)}
.about .dev{margin-top:8px;color:var(--fg);font-weight:600}

/* الإشعار */
.toast{position:fixed;z-index:900;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h,200px) + 86px);
  background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow);animation:fade .2s ease}

/* العلامات على الخريطة */
.me{width:22px;height:22px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 7px rgba(51,195,255,.25),0 2px 6px rgba(0,0,0,.35)}
.pin{width:38px;height:38px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.pin .ic{transform:rotate(45deg);color:#fff;width:19px;height:19px;stroke-width:2.2}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);color:#fff}
.dot .ic{width:16px;height:16px;stroke-width:2.3}
.dst{width:20px;height:20px;border-radius:50%;background:var(--danger);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.leaflet-popup-content{font-family:var(--font);text-align:right;margin:12px 14px;min-width:150px}
.leaflet-popup-content b{font-size:15px}
.leaflet-popup-content small{color:var(--muted);display:block}
.leaflet-popup-content button{margin-top:10px;width:100%;border:0;border-radius:10px;padding:9px;background:var(--panel-2);color:var(--danger);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
