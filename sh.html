<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>الشويلات</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen map, floating top bar (search + speed), bottom sheet for route + reports */
:root{
  --asphalt:#14171c; --panel:#1d2128; --panel-2:#272c35; --line:#353b46;
  --fg:#eef1f5; --muted:#9aa3b0; --amber:#ffb627; --amber-ink:#1a1300;
  --route:#3fa9ff; --danger:#ff5a4e; --ok:#3ecf8e;
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--asphalt);color:var(--fg);font-family:var(--font);font-size:15px;overflow:hidden}
#map{position:fixed;inset:0;z-index:0;background:#0e1014}
[hidden]{display:none!important}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:500;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;gap:8px;align-items:stretch;pointer-events:none}
.top > *{pointer-events:auto}
.brand{background:var(--amber);color:var(--amber-ink);font-weight:700;border-radius:12px;padding:0 12px;display:flex;align-items:center;font-size:15px;white-space:nowrap}
form.search{flex:1;min-width:0;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
form.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;padding:11px 12px;outline:none}
form.search button{background:transparent;border:0;color:var(--amber);font:inherit;font-weight:600;padding:0 12px}
.results{position:fixed;z-index:600;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:45vh;overflow:auto}
.results button{display:block;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit;padding:12px}
.results button:last-child{border-bottom:0}
.results small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* speed */
.speed{position:fixed;z-index:500;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 66px);
  width:64px;height:64px;border-radius:50%;background:var(--panel);border:3px solid var(--line);display:grid;place-items:center;text-align:center;line-height:1}
.speed b{font-size:22px;font-variant-numeric:tabular-nums;display:block}
.speed span{font-size:10px;color:var(--muted)}

/* floating buttons */
.fabs{position:fixed;z-index:500;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;
  bottom:calc(var(--sheet-h,170px) + env(safe-area-inset-bottom,0px) + 14px);transition:bottom .2s}
.fab{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:20px;display:grid;place-items:center}
.fab.on{background:var(--route);color:#fff;border-color:var(--route)}
.fab.report{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700}

/* bottom sheet */
.sheet{position:fixed;z-index:550;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.route-info{display:flex;gap:16px;align-items:baseline;margin-bottom:10px}
.route-info .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.route-info .sub{color:var(--muted);font-variant-numeric:tabular-nums}
.route-info .dest{flex:1;min-width:0;text-align:left;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;font-weight:600;border-radius:12px;padding:12px 10px}
.btn.primary{background:var(--route);border-color:var(--route);color:#fff}
.btn.warn{color:var(--danger)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}

/* report picker */
.picker-bg{position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.picker{width:100%;background:var(--panel);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.picker h2{margin:0 0 4px;font-size:18px}
.picker p{margin:0 0 14px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rtype{border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:14px;padding:14px 6px;font:inherit;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.rtype i{font-style:normal;font-size:26px}

.toast{position:fixed;z-index:800;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);
  background:var(--fg);color:var(--asphalt);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;text-align:center}

/* markers */
.me{width:22px;height:22px;border-radius:50%;background:var(--route);border:4px solid #fff;box-shadow:0 0 0 8px rgba(63,169,255,.25)}
.rep{width:36px;height:36px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--amber);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.rep i{transform:rotate(45deg);font-style:normal;font-size:17px}
.rep.police{background:#4d7cff}.rep.crash{background:var(--danger)}.rep.jam{background:#ff8a3d}
.dst{width:18px;height:18px;border-radius:4px;background:var(--danger);border:3px solid #fff}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg)}
.leaflet-popup-content{font-family:var(--font);text-align:right;margin:12px 14px}
.leaflet-popup-content button{margin-top:8px;width:100%;border:0;border-radius:8px;padding:8px;background:var(--panel-2);color:var(--danger);font:inherit}
.leaflet-control-attribution{font-size:9px;background:rgba(20,23,28,.7)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-control-zoom{display:none}

/* لوحة التوجيه */
.banner{position:fixed;z-index:520;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 62px);background:#0f5d2e;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.b-arrow{font-size:44px;line-height:1;width:56px;text-align:center;color:#fff}
.b-body{flex:1;min-width:0;color:#fff}
.b-dist{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.b-text{font-size:17px;font-weight:600}
.b-next{font-size:12px;opacity:.75;margin-top:2px}
body:has(.banner:not([hidden])) .speed{top:calc(env(safe-area-inset-top,0px) + 170px)}

/* splash + credit */
.splash{position:fixed;inset:0;z-index:900;background:var(--asphalt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .5s}
.splash .logo{background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:38px;border-radius:20px;padding:10px 28px}
.splash .by{color:var(--muted);font-size:14px}
.splash.out{opacity:0;pointer-events:none}
.credit{margin:12px 0 0;text-align:center;color:var(--muted);font-size:12px}
.credit b{color:var(--amber)}

/* quick categories */
.cats{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.cats button{border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;border-radius:999px;padding:8px 12px}
.results .label{padding:10px 12px 0;color:var(--muted);font-size:12px}
.results .dist{float:left;color:var(--amber);font-size:12px;font-variant-numeric:tabular-nums}
.results .del{float:left;color:var(--danger);font-size:12px;margin-right:10px;padding:0 4px}

/* أزرار سريعة */
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.quick button{border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;font-size:12px;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.quick i{font-style:normal;font-size:20px}
.mini{display:flex;gap:6px;margin-top:8px}
.mini button{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;font-size:12px;border-radius:10px;padding:8px 2px;white-space:nowrap}

/* نماذج وإعدادات */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field > label{color:var(--muted);font-size:13px}
.field input,.field select{background:var(--panel-2);border:1px solid var(--line);color:var(--fg);font:inherit;border-radius:10px;padding:10px;width:100%}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;border-radius:10px;padding:9px 4px}
.seg button.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.crosshair{position:fixed;left:50%;top:50%;z-index:450;transform:translate(-50%,-100%);font-size:40px;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.speed.over{border-color:var(--danger);background:#5a1410}
.night .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.place{width:30px;height:30px;border-radius:50%;background:#7d5cff;border:2px solid #fff;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.place.home{background:var(--ok)}.place.work{background:var(--route)}
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="logo">الشويلات</div>
  <div class="by">برمجة حسين</div>
</div>
<div id="map"></div>

<div class="top">
  <div class="brand">الشويلات</div>
  <form class="search" id="searchForm" autocomplete="off">
    <input id="q" type="search" placeholder="ابحث في الشويلات: مكان، شارع، مطعم…" enterkeyhint="search">
    <button type="submit">بحث</button>
  </form>
</div>
<div class="results" id="results" hidden></div>

<div class="banner" id="banner" hidden>
  <div class="b-arrow" id="bArrow">↑</div>
  <div class="b-body">
    <div class="b-dist" id="bDist"></div>
    <div class="b-text" id="bText"></div>
    <div class="b-next" id="bNext"></div>
  </div>
</div>

<div class="speed"><div><b id="spd">0</b><span>كم/س</span></div></div>

<div class="fabs">
  <button class="fab report" id="btnReport" aria-label="بلاغ">!</button>
  <button class="fab on" id="btnSound" aria-label="الصوت">🔊</button>
  <button class="fab on" id="btnFollow" aria-label="تتبع موقعي">◎</button>
</div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div id="idle">
    <div class="quick">
      <button type="button" id="qHome"><i>🏠</i>البيت</button>
      <button type="button" id="qWork"><i>💼</i>العمل</button>
      <button type="button" id="qFav"><i>⭐</i>المحفوظة</button>
      <button type="button" id="qAdd"><i>➕</i>أضف مكان</button>
      <button type="button" id="qSet"><i>⚙️</i>الإعدادات</button>
    </div>
    <p class="hint">ابحث عن مكان، أو اضغط مطولاً على الخريطة لتحديد الوجهة.</p>
    <div class="stats" id="stats"></div>
    <p class="credit"><b>الشويلات</b> · برمجة حسين</p>
  </div>
  <div id="routing" hidden>
    <div class="route-info">
      <div class="big" id="rTime">–</div>
      <div class="sub" id="rDist">–</div>
      <div class="dest" id="rDest"></div>
    </div>
    <p class="hint" id="rFirst" style="margin:0 0 6px;color:var(--fg)"></p>
    <div class="stats" id="routeWarn"></div>
    <div class="mini">
      <button type="button" id="mSave">⭐ حفظ</button>
      <button type="button" id="mHome">🏠 بيتي</button>
      <button type="button" id="mWork">💼 عملي</button>
      <button type="button" id="mShare">📤 مشاركة</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="btnGo">انطلق</button>
      <button class="btn warn" id="btnCancel">إلغاء</button>
    </div>
  </div>
  <div id="adding" hidden>
    <p class="hint">حرّك الخريطة حتى تصير العلامة 📍 فوق المكان بالضبط.</p>
    <div class="field"><input id="apName" type="text" placeholder="اسم المكان، مثلاً: مطعم أبو علي" maxlength="60"></div>
    <div class="field"><select id="apCat">
      <option value="📍">📍 عام</option><option value="🍽️">🍽️ مطعم</option><option value="☕">☕ كافيه</option>
      <option value="🛒">🛒 محل / سوق</option><option value="💊">💊 صيدلية</option><option value="🏥">🏥 عيادة</option>
      <option value="⛽">⛽ وقود</option><option value="🔧">🔧 تصليح</option><option value="🕌">🕌 جامع</option><option value="🏠">🏠 بيت</option>
    </select></div>
    <div class="row">
      <button class="btn primary" id="apSave" type="button">حفظ المكان</button>
      <button class="btn warn" id="apCancel" type="button">إلغاء</button>
    </div>
  </div>
</div>
<div class="crosshair" id="cross" hidden>📍</div>

<div class="picker-bg" id="settings" hidden>
  <div class="picker">
    <h2>إعدادات الشويلات</h2>
    <p>تنحفظ على جهازك.</p>
    <div class="field"><label>شكل الخريطة</label><div class="seg" id="sStyle"></div></div>
    <div class="field"><label>التوجيه الصوتي</label><div class="seg" id="sSound"></div></div>
    <div class="field"><label>تنبيه تجاوز السرعة</label><div class="seg" id="sSpeed"></div></div>
    <div class="row">
      <button class="btn warn" id="sClear" type="button">مسح كل البيانات</button>
      <button class="btn" id="sClose" type="button">إغلاق</button>
    </div>
    <p class="credit"><b>الشويلات</b> · برمجة حسين</p>
  </div>
</div>

<div class="picker-bg" id="picker" hidden>
  <div class="picker">
    <h2>بلاغ جديد في الشويلات</h2>
    <p>يظهر على الخريطة لمدة ساعتين.</p>
    <div class="grid" id="types"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="btnClosePicker">إغلاق</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
const TYPES={
  crash:{n:"حادث",i:"💥"}, police:{n:"شرطة",i:"🚓"}, jam:{n:"زحمة",i:"🚗"},
  hole:{n:"حفرة",i:"🕳️"}, danger:{n:"خطر",i:"⚠️"}, closed:{n:"طريق مغلق",i:"⛔"}
};
const REPORT_TTL=2*60*60*1000;
const STORE="shwaylat.reports.v1";
const $=id=>document.getElementById(id);

// بيانات المستخدم المحفوظة على الجهاز
const SKEY="shwaylat.data.v1";
let D={home:null,work:null,favs:[],recent:[],places:[],mapStyle:"auto",sound:true,speedLimit:0};
try{Object.assign(D,JSON.parse(localStorage.getItem(SKEY)||"{}"))}catch(e){}
function saveD(){try{localStorage.setItem(SKEY,JSON.stringify(D))}catch(e){}}

// حدود العراق فقط
const IRAQ=L.latLngBounds([29.0,38.7],[37.45,48.8]);
const map=L.map("map",{zoomControl:false,attributionControl:true,maxBounds:IRAQ.pad(0.03),maxBoundsViscosity:1,minZoom:6}).setView([33.3152,44.3661],12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,bounds:IRAQ.pad(0.03),
  attribution:'&copy; OpenStreetMap'
}).addTo(map);
map.attributionControl.setPrefix("الشويلات");
setTimeout(()=>{$("splash").classList.add("out");setTimeout(()=>$("splash").remove(),600)},1400);

let me=null, meMarker=null, follow=true, dest=null, destMarker=null, routeLine=null, navigating=false, lastRouteAt=0;

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}

/* ---------- location ---------- */
function onPos(p){
  me=[p.coords.latitude,p.coords.longitude];
  const kmh=p.coords.speed!=null&&p.coords.speed>=0?Math.round(p.coords.speed*3.6):0;
  $("spd").textContent=kmh;
  // تنبيه تجاوز السرعة
  const over=D.speedLimit&&kmh>D.speedLimit;
  document.querySelector(".speed").classList.toggle("over",!!over);
  if(over&&Date.now()-(onPos.lastOver||0)>15000){onPos.lastOver=Date.now();beep();toast(`انتبه: سرعتك ${kmh} أكثر من ${D.speedLimit}`)}
  if(!meMarker){
    meMarker=L.marker(me,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:1000}).addTo(map);
    if(dest)buildRoute(true); else map.setView(me,16);
  } else meMarker.setLatLng(me);
  if(follow) map.panTo(me,{animate:true});
  if(navigating && dest) navTick();
  checkNearbyReports();
}
function onErr(e){
  toast(e.code===1?"اسمح للمتصفح بالوصول إلى موقعك":"تعذر تحديد الموقع، تأكد من تشغيل GPS");
}
if("geolocation" in navigator){
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
} else toast("المتصفح لا يدعم تحديد الموقع");

map.on("dragstart",()=>{follow=false;$("btnFollow").classList.remove("on")});
$("btnFollow").onclick=()=>{follow=true;$("btnFollow").classList.add("on");if(me)map.setView(me,Math.max(map.getZoom(),16))};

/* ---------- reports ---------- */
let reports=[];
function loadReports(){
  try{reports=JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){reports=[]}
  const now=Date.now();reports=reports.filter(r=>now-r.t<REPORT_TTL);
}
function saveReports(){try{localStorage.setItem(STORE,JSON.stringify(reports))}catch(e){}}
const repLayer=L.layerGroup().addTo(map);
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?"الآن":m<60?`قبل ${m} دقيقة`:`قبل ${Math.round(m/60)} ساعة`}
function drawReports(){
  repLayer.clearLayers();
  reports.forEach(r=>{
    const ty=TYPES[r.k];
    const m=L.marker([r.lat,r.lng],{icon:L.divIcon({className:"",html:`<div class="rep ${r.k}"><i>${ty.i}</i></div>`,iconSize:[36,36],iconAnchor:[18,36],popupAnchor:[0,-34]})});
    const box=document.createElement("div");
    box.innerHTML=`<b>${ty.n}</b><br><span style="color:var(--muted);font-size:12px">${ago(r.t)}</span>`;
    const del=document.createElement("button");del.textContent="لم يعد موجوداً";
    del.onclick=()=>{reports=reports.filter(x=>x.id!==r.id);saveReports();drawReports();renderStats();map.closePopup()};
    box.appendChild(del);
    m.bindPopup(box);repLayer.addLayer(m);
  });
}
function renderStats(){
  const s=$("stats");s.innerHTML="";
  if(!reports.length){s.innerHTML='<span class="chip">لا توجد بلاغات حالياً</span>';return}
  const c={};reports.forEach(r=>c[r.k]=(c[r.k]||0)+1);
  Object.keys(c).forEach(k=>{const sp=document.createElement("span");sp.className="chip";sp.textContent=`${TYPES[k].i} ${TYPES[k].n}: ${c[k]}`;s.appendChild(sp)});
}

async function runSearch(q){
  const r=$("results");r.hidden=false;r.innerHTML='<button disabled>جارٍ البحث في كل المصادر…</button>';
  if(searchCtl)searchCtl.abort();searchCtl=new AbortController();const sig=searchCtl.signal;
  const c=center();
  const nomi=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=15&countrycodes=iq&accept-language=ar&addressdetails=1&q=${encodeURIComponent(q)}&viewbox=${c[1]-0.6},${c[0]+0.6},${c[1]+0.6},${c[0]-0.6}`;
  const photon=`https://photon.komoot.io/api/?limit=15&q=${encodeURIComponent(q)}&lat=${c[0]}&lon=${c[1]}&bbox=${IQ_BBOX}`;
  const nameRe=q.replace(/[.*+?^${}()|[\]\\"]/g,"").replace(/\s+/g,".*");
  const over=`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(`[out:json][timeout:12];nwr["name"~"${nameRe}",i](around:15000,${c[0]},${c[1]});out center 40;`)}`;
  try{
    const [a,b,o]=await Promise.all([getJSON(nomi,sig),getJSON(photon,sig),getJSON(over,sig)]);
    const list=[];
    // أماكنك المضافة والمحفوظة أولاً
    const ql=q.toLowerCase();
    [...D.places,...D.favs].forEach(p=>{if(p.name.toLowerCase().includes(ql))list.push({name:p.name,sub:"من أماكنك ⭐",lat:p.lat,lon:p.lon})});
    (a||[]).forEach(x=>{const p=x.display_name.split(/[،,]\s*/);list.push({name:x.name||p[0],sub:p.slice(1,4).join("، "),lat:+x.lat,lon:+x.lon})});
    ((b&&b.features)||[]).forEach(f=>{const p=f.properties;if(p.countrycode&&p.countrycode!=="IQ")return;
      list.push({name:p.name||p.street||"",sub:[p.street,p.district,p.city,p.state].filter(Boolean).join("، "),lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]})});
    ((o&&o.elements)||[]).forEach(e=>{const t=e.tags||{},la=e.lat||(e.center&&e.center.lat),lo=e.lon||(e.center&&e.center.lon);if(!la)return;
      list.push({name:t["name:ar"]||t.name,sub:[t["addr:street"],t["addr:city"]].filter(Boolean).join("، ")||"قريب منك",lat:la,lon:lo})});
    showResults(list.filter(x=>x.name),c);
  }catch(err){if(err.name!=="AbortError")r.innerHTML='<button disabled>تعذر البحث، تحقق من الإنترنت</button>'}
}

async function runCategory(filter,label){
  const r=$("results");r.hidden=false;r.innerHTML=`<button disabled>نجيب كل ${esc(label)} القريبة منك…</button>`;
  if(searchCtl)searchCtl.abort();searchCtl=new AbortController();const sig=searchCtl.signal;

      lat:e.lat||(e.center&&e.center.lat),lon:e.lon||(e.center&&e.center.lon)}}).filter(x=>x.lat);
    showResults(list,c);

}

/* ---------- تعليمات الطريق بالعربي ---------- */
const MOD={"right":["انعطف يميناً","↱"],"slight right":["انحرف قليلاً لليمين","↗"],"sharp right":["انعطف بحدة لليمين","↘"],
  "left":["انعطف يساراً","↰"],"slight left":["انحرف قليلاً لليسار","↖"],"sharp left":["انعطف بحدة لليسار","↙"],
  "straight":["استمر مباشرة","↑"],"uturn":["استدر للخلف","↶"]};
function instr(st){
  const m=st.maneuver, mod=MOD[m.modifier]||["استمر","↑"];
  const road=st.name?` إلى ${st.name}`:"";
  switch(m.type){
    case "arrive": return {t:"وصلت إلى وجهتك",a:"🏁"};
    case "roundabout": case "rotary": case "roundabout turn":
      return {t:`في الدوّار خذ المخرج ${["","الأول","الثاني","الثالث","الرابع","الخامس"][m.exit]||m.exit||""}${road}`,a:"↻"};
    case "exit roundabout": case "exit rotary": return {t:`اخرج من الدوّار${road}`,a:mod[1]};
    case "merge": return {t:`اندمج${road}`,a:mod[1]};
    case "on ramp": return {t:`خذ المدخل${road}`,a:mod[1]};
    case "off ramp": return {t:`خذ المخرج${road}`,a:mod[1]};
    case "fork": return {t:`عند التفرع ${mod[0].replace("انعطف ","اتجه ")}${road}`,a:mod[1]};
    case "end of road": return {t:`في نهاية الطريق ${mod[0]}${road}`,a:mod[1]};
    case "new name": case "continue": return {t:m.modifier==="straight"||!m.modifier?`استمر${road||" مباشرة"}`:`${mod[0]}${road}`,a:mod[1]};
    default: return {t:`${mod[0]}${road}`,a:mod[1]};
  }
}

// كلام الصوت باللهجة العراقية (عمارتلي) — اللوحة المكتوبة تبقى مثل ما هي
const IQ={"right":"فوت يمينك","slight right":"ميّل شوية على يمينك","sharp right":"اكسرها يمين",
  "left":"فوت يسارك","slight left":"ميّل شوية على يسارك","sharp left":"اكسرها يسار",
  "straight":"خليك سيده","uturn":"ارجع لورا يابه"};
function iraqi(st){
  const m=st.maneuver, go=IQ[m.modifier]||"خليك سيده";
  const road=st.name?` على ${st.name}`:"";
  switch(m.type){
    case "arrive": return "وصلنا عمي، الحمد لله على السلامة";
    case "roundabout": case "rotary": case "roundabout turn":
      return `بالفلكة اطلع من الطلعة ${["","الأولى","الثانية","الثالثة","الرابعة","الخامسة"][m.exit]||m.exit||""}${road}`;
    case "exit roundabout": case "exit rotary": return `اطلع من الفلكة${road}`;
    case "merge": return `دخّل ويا الطريق${road}`;
    case "on ramp": return `فوت من الصعدة${road}`;
    case "off ramp": return `اطلع من الطلعة${road}`;
    case "fork": return `عند الفرع ${go}${road}`;
    case "end of road": return `من يخلص الشارع ${go}${road}`;
    case "new name": case "continue": return m.modifier==="straight"||!m.modifier?`خليك سيده${road}`:`${go}${road}`;
    default: return `${go}${road}`;
  }
}

let steps=[], stepIdx=1, spoken={}, routePts=[], lastOffCheck=0;
function setBanner(){
  const b=$("banner");
  if(!navigating||!steps[stepIdx]){b.hidden=true;return}
  const st=steps[stepIdx], i=instr(st), d=me?map.distance(me,[st.maneuver.location[1],st.maneuver.location[0]]):0;
  b.hidden=false;$("bArrow").textContent=i.a;$("bDist").textContent=fmtDist(d);$("bText").textContent=i.t;
  const nx=steps[stepIdx+1];$("bNext").textContent=nx?`بعدها: ${instr(nx).t}`:"";
}
function navTick(){
  if(map.distance(me,dest)<35){say("وصلت إلى وجهتك");toast("وصلت إلى وجهتك");stopRoute();return}
  // خرجت عن الطريق؟ نعيد الحساب
  if(Date.now()-lastOffCheck>8000&&routePts.length){
    lastOffCheck=Date.now();
    let min=1e9;for(let i=0;i<routePts.length;i+=2){const dd=map.distance(me,routePts[i]);if(dd<min)min=dd}
    if(min>60){say("جاري إعادة حساب الطريق");buildRoute(false);return}
  }
  const st=steps[stepIdx];if(!st){setBanner();return}
  const d=map.distance(me,[st.maneuver.location[1],st.maneuver.location[0]]);
  const key=stepIdx, t=instr(st).t;
  updateEta();
  if(d<25){ stepIdx++; setBanner(); return; }
  if(d<60&&!spoken[key+"n"]){spoken[key+"n"]=1;say(`الآن ${t}`)}
  else if(d<200&&d>=60&&!spoken[key+"m"]){spoken[key+"m"]=1;say(`بعد ${Math.round(d/10)*10} متر ${t}`)}
  else if(d<600&&d>=300&&!spoken[key+"f"]){spoken[key+"f"]=1;say(`بعد ${fmtDist(Math.round(d/50)*50).replace("م","متر").replace("كم","كيلومتر")} ${t}`)}
  setBanner();
}

// الوقت والمسافة المتبقية ووقت الوصول
function showEta(dist,dur){
  const arr=new Date(Date.now()+dur*1000).toLocaleTimeString("ar-IQ",{hour:"numeric",minute:"2-digit"});
  $("rTime").textContent=fmtTime(dur);
  $("rDist").textContent=`${fmtDist(dist)} · الوصول ${arr}`;
}
function updateEta(){
  if(!steps.length||!me)return;
  let dist=0,dur=0;
  for(let i=stepIdx;i<steps.length;i++){dist+=steps[i].distance;dur+=steps[i].duration}
  const st=steps[stepIdx],prev=steps[stepIdx-1];
  if(st&&prev&&prev.distance>0){
    const f=Math.min(1,map.distance(me,[st.maneuver.location[1],st.maneuver.location[0]])/prev.distance);
    dist+=prev.distance*f;dur+=prev.duration*f;
  }
  showEta(dist,dur);
}

async function nameOf(ll){
  try{const r=await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=ar&lat=${ll[0]}&lon=${ll[1]}`)).json();
    const a=r.address||{};return r.name||a.road||a.neighbourhood||a.suburb||(r.display_name||"").split(/[،,]/)[0]||"نقطة على الخريطة";
  }catch(e){return "نقطة على الخريطة"}
}

async function buildRoute(fit){
  if(!dest)return;
  if(!me){$("rTime").textContent="–";toast("بانتظار تحديد موقعك…");return}
  lastRouteAt=Date.now();
  try{
    const url=`https://router.project-osrm.org/route/v1/driving/${me[1]},${me[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson&steps=true`;
    const res=await fetch(url);const data=await res.json();
    if(!data.routes||!data.routes.length)throw 0;
    const rt=data.routes[0];
    const pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
    routePts=pts;steps=rt.legs[0].steps;stepIdx=1;spoken={};
    if(routeLine)routeLine.remove();
    // الخط الأزرق + خط متقطع (كيبل) يوصلك من مكانك للشارع ومن الشارع للوجهة
    routeLine=L.layerGroup([
      L.polyline([me,pts[0]],{color:"#3fa9ff",weight:4,dashArray:"6 8"}),
      L.polyline([pts[pts.length-1],dest],{color:"#ff5a4e",weight:4,dashArray:"6 8"}),
      L.polyline(pts,{color:"#0b4f86",weight:10,opacity:.9}),
      L.polyline(pts,{color:"#3fa9ff",weight:6})
    ]).addTo(map);
    // أول تعليمة بالعربي في اللوحة السفلية
    const first=steps[1]?instr(steps[1]).t:"";
    $("rFirst").textContent=steps[0]&&steps[0].name?`انطلق من ${steps[0].name}${first?" ثم "+first:""}`:first;
    if(navigating)setBanner();
    showEta(rt.distance,rt.duration);
    // reports on the route
    const w=$("routeWarn");w.innerHTML="";
    const near=reports.filter(r=>pts.some((p,i)=>i%5===0&&map.distance(p,[r.lat,r.lng])<80));
    if(near.length){near.forEach(r=>{const s=document.createElement("span");s.className="chip";s.textContent=`${TYPES[r.k].i} ${TYPES[r.k].n} على طريقك`;w.appendChild(s)})}
    updateSheetH();
    if(fit){follow=false;$("btnFollow").classList.remove("on");map.fitBounds(L.latLngBounds(pts),{padding:[40,40],paddingBottomRight:[40,200]})}
  }catch(e){$("rTime").textContent="–";toast("تعذر حساب المسار")}
}
function stopRoute(){
  navigating=false;dest=null;steps=[];routePts=[];
  if(routeLine)routeLine.remove();if(destMarker)destMarker.remove();
  routeLine=destMarker=null;
  $("routing").hidden=true;$("idle").hidden=false;$("btnGo").textContent="انطلق";$("banner").hidden=true;
  releaseWake();
  updateSheetH();
}
$("btnCancel").onclick=stopRoute;
$("btnGo").onclick=()=>{
  navigating=!navigating;
  $("btnGo").textContent=navigating?"إيقاف التوجيه":"انطلق";
  if(navigating){
    follow=true;$("btnFollow").classList.add("on");if(me)map.setView(me,17);

};

function goSaved(p){if(p)setDest([p.lat,p.lon],p.name)}
$("qHome").onclick=()=>D.home?goSaved(D.home):toast("ما حددت بيتك بعد. اختر المكان ثم اضغط 🏠 بيتي");
$("qWork").onclick=()=>D.work?goSaved(D.work):toast("ما حددت عملك بعد. اختر المكان ثم اضغط 💼 عملي");
$("mHome").onclick=()=>{if(!dest)return;D.home={name:"البيت",lat:dest[0],lon:dest[1]};saveD();drawPlaces();toast("تم حفظه كبيتك 🏠")};
$("mWork").onclick=()=>{if(!dest)return;D.work={name:"العمل",lat:dest[0],lon:dest[1]};saveD();drawPlaces();toast("تم حفظه كمكان عملك 💼")};
$("mSave").onclick=()=>{
  if(!dest)return;const n=curName();
  if(D.favs.some(f=>Math.abs(f.lat-dest[0])<1e-5&&Math.abs(f.lon-dest[1])<1e-5)){toast("محفوظ من قبل ⭐");return}
  D.favs.unshift({name:n,lat:dest[0],lon:dest[1]});saveD();toast("تم الحفظ في المحفوظة ⭐");
};
$("mShare").onclick=async()=>{
  if(!dest)return;const n=curName();
  const url=`${location.origin}${location.pathname}?to=${dest[0].toFixed(5)},${dest[1].toFixed(5)}&n=${encodeURIComponent(n)}`;
  const text=`${n} — افتحه في الشويلات`;
  try{if(navigator.share){await navigator.share({title:"الشويلات",text,url});return}}catch(e){if(e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(`${text}\n${url}`);toast("تم نسخ الرابط، الصقه بالواتساب")}catch(e){toast(url)}
};

function savedList(){
  const r=$("results");r.innerHTML="";r.hidden=false;
  const sec=(title,items,delKey)=>{
    if(!items.length)return;
    r.insertAdjacentHTML("beforeend",`<div class="label">${title}</div>`);
    items.forEach((p,i)=>{
      const b=document.createElement("button");b.type="button";
      b.innerHTML=`${delKey?'<span class="del" data-del="1">حذف</span>':""}${esc((p.icon?p.icon+" ":"")+p.name)}`;
      b.onclick=e=>{
        if(e.target.dataset.del){D[delKey].splice(i,1);saveD();drawPlaces();savedList();return}
        r.hidden=true;goSaved(p);
      };
      r.appendChild(b);
    });
  };
  sec("البيت والعمل",[D.home&&{...D.home,icon:"🏠"},D.work&&{...D.work,icon:"💼"}].filter(Boolean));
  sec("المحفوظة ⭐",D.favs,"favs");
  sec("أماكن أضفتها ➕",D.places.map(p=>({...p,icon:p.cat})),"places");
  sec("آخر الأماكن",D.recent,"recent");
  if(!r.children.length)r.innerHTML='<button disabled>ما عندك أماكن محفوظة بعد</button>';
}
$("qFav").onclick=savedList;

/* ---------- أضف مكان ناقص ---------- */
const placesLayer=L.layerGroup().addTo(map);
function drawPlaces(){
  placesLayer.clearLayers();
  const mk=(p,cls,ic)=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:`<div class="place ${cls}">${ic}</div>`,iconSize:[30,30],iconAnchor:[15,15]})})
    .on("click",()=>goSaved(p)).addTo(placesLayer);
  if(D.home)mk(D.home,"home","🏠");
  if(D.work)mk(D.work,"work","💼");
  D.places.forEach(p=>mk(p,"",p.cat));
}
function exitAdding(){$("adding").hidden=true;$("cross").hidden=true;$("idle").hidden=false;updateSheetH()}
$("qAdd").onclick=()=>{
  $("idle").hidden=true;$("adding").hidden=false;$("cross").hidden=false;$("apName").value="";
  follow=false;$("btnFollow").classList.remove("on");if(me)map.setView(me,17);updateSheetH();
};
$("apCancel").onclick=exitAdding;
$("apSave").onclick=()=>{
  const n=$("apName").value.trim();if(!n){toast("اكتب اسم المكان");$("apName").focus();return}
  const c=map.getCenter();
  D.places.unshift({name:n,cat:$("apCat").value,lat:c.lat,lon:c.lng});saveD();drawPlaces();exitAdding();
  toast(`تمت إضافة "${n}" ويظهر بالبحث`);
};

/* ---------- الإعدادات ---------- */
function applyStyle(){
  const h=new Date().getHours();
  document.body.classList.toggle("night",D.mapStyle==="night"||(D.mapStyle==="auto"&&(h>=18||h<6)));
}
function seg(id,opts,key,after){
  const el=$(id);el.innerHTML="";
  opts.forEach(([v,l])=>{const b=document.createElement("button");b.type="button";b.textContent=l;if(D[key]===v)b.className="on";
    b.onclick=()=>{D[key]=v;saveD();seg(id,opts,key,after);if(after)after()};el.appendChild(b)});
}
function renderSettings(){
  seg("sStyle",[["auto","تلقائي"],["day","نهاري"],["night","ليلي"]],"mapStyle",applyStyle);
  seg("sSound",[[true,"تشغيل"],[false,"إيقاف"]],"sound",syncSound);
  seg("sSpeed",[[0,"بدون"],[80,"80"],[100,"100"],[120,"120"]],"speedLimit");
  $("sClear").textContent="مسح كل البيانات";$("sClear").dataset.sure="";
}
$("qSet").onclick=()=>{renderSettings();$("settings").hidden=false};
$("sClose").onclick=()=>$("settings").hidden=true;
$("settings").onclick=e=>{if(e.target.id==="settings")$("settings").hidden=true};
$("sClear").onclick=()=>{
  if(!$("sClear").dataset.sure){$("sClear").dataset.sure="1";$("sClear").textContent="اضغط مرة ثانية للتأكيد";return}
  try{localStorage.removeItem(SKEY);localStorage.removeItem(STORE)}catch(e){}
  location.href=location.pathname;
};

function updateSheetH(){document.documentElement.style.setProperty("--sheet-h",$("sheet").offsetHeight+"px")}

applyStyle();setInterval(applyStyle,600000);
drawPlaces();
// فتح رابط مشاركة: ?to=lat,lon&n=الاسم
try{const sp=new URLSearchParams(location.search),to=sp.get("to");
  if(to){const [a,b]=to.split(",").map(Number);if(IRAQ.contains([a,b]))setTimeout(()=>setDest([a,b],sp.get("n")||"مكان مُرسل لك"),1500)}}catch(e){}
loadReports();drawReports();renderStats();updateSheetH();
setInterval(()=>{const n=reports.length;loadReports();if(reports.length!==n){drawReports();renderStats()}},60000);
window.addEventListener("resize",updateSheetH);
})();
</script>
