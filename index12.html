<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Nasa App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        .app-button {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .app-button:active {
            opacity: 0.7;
        }
        .app-button.secondary {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
        }
    </style>
</head>
<body>
    <h1>🎁 X Nasa App</h1>
    
    <div class="button-container">
        <button class="app-button" onclick="sendAction('post_gift')">
            🎁 نشر هدية
        </button>
        <button class="app-button" onclick="sendAction('post_username2')">
            💬 نشر معرف
        </button>
        <button class="app-button secondary" onclick="sendAction('post_username')">
            📢 نشر إعلان
        </button>
    </div>

    <script>
        // تهيئة التطبيق
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // دالة إرسال الأمر للبوت
        function sendAction(action) {
            tg.sendData(JSON.stringify({ action: action }));
            tg.close();
        }
    </script>
</body>
</html>
